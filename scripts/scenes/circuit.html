html,body{margin:0;width:1000px;height:1000px;background:#0d0d0d;overflow:hidden}

.board{position:absolute;left:-150px;top:-40px;width:1400px;height:1400px;transform-origin:700px 700px;
  transform:rotateX(56deg) rotateZ(-14deg);transform-style:preserve-3d}
.board>svg{position:absolute;inset:0}
.chip{position:absolute;left:550px;top:550px;width:300px;height:300px;transform:translateZ(18px);

.chip::after{content:"";position:absolute;left:24px;top:24px;width:16px;height:16px;border-radius:50%;background:#2b2b2b}
.dof-far{position:absolute;inset:0;backdrop-filter:blur(9px);mask:linear-gradient(#000 0,#000 30%,transparent 52%)}
.dof-near{position:absolute;inset:0;backdrop-filter:blur(5px);mask:linear-gradient(transparent 78%,#000 100%)}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(#fff,rgba(255,255,255,.6) 55%,rgba(255,255,255,0) 72%);filter:blur(4px)}
.rack{position:absolute;left:270px;top:-40px;width:150px;height:640px;background:linear-gradient(90deg,#060606,#1b1b1b 40%,#0a0a0a);filter:blur(3px)}
.light{position:absolute;inset:0;background:radial-gradient(60% 40% at 72% 18%,rgba(255,255,255,.55),transparent 70%)}
.vig{position:absolute;inset:0;background:linear-gradient(transparent 62%,rgba(0,0,0,.55))}
.rim{position:absolute;inset:0;background:radial-gradient(45% 30% at 58% 62%,rgba(255,255,255,.22),transparent 70%)}
