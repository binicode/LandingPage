<!doctype html>
<!-- Grayscale source scene for assets/images/workspace.*  (rendered 1000x1000, then graded by scripts/grade_images.py) -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:1000px;background:#000;overflow:hidden}
svg{display:block}
</style></head><body>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="slats" width="84" height="1000" patternUnits="userSpaceOnUse">
      <rect width="84" height="1000" fill="#5a5a5a"/>
      <rect x="0" width="6" height="1000" fill="#1e1e1e"/>
      <rect x="6" width="30" height="1000" fill="#646464"/>
      <rect x="50" width="20" height="1000" fill="#505050"/>
    </pattern>
    <filter id="wood" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .35"/></feComponentTransfer>
    </filter>
    <radialGradient id="beam" cx="760" cy="420" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".8"/>
      <stop offset=".18" stop-color="#000" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset=".5" stop-color="#5c5c5c"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#cfcfcf"/>
    </linearGradient>
    <radialGradient id="pot" cx=".7" cy=".35" r=".8">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset=".35" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="b24"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <!-- wooden slat wall, softly out of focus -->
  <g filter="url(#b3)">
    <rect width="1000" height="660" fill="url(#slats)"/>
    <rect width="1000" height="660" filter="url(#wood)"/>
  </g>
  <rect width="1000" height="660" fill="url(#beam)"/>
  <rect width="1000" height="1000" fill="url(#shade)"/>
  <!-- glow of the laptop screen on the wall -->
  <ellipse cx="720" cy="470" rx="260" ry="190" fill="#fff" opacity=".22" filter="url(#b24)"/>

  <!-- desk -->
  <rect y="640" width="1000" height="360" fill="url(#desk)"/>
  <rect y="640" width="1000" height="6" fill="#a8a8a8" filter="url(#b1)"/>
  <rect y="640" width="1000" height="360" fill="url(#shade)"/>

  <!-- laptop -->
  <g filter="url(#b1)">
    <!-- base -->
    <path d="M520 700 L900 682 L978 760 L470 786 Z" fill="#9a9a9a"/>
    <path d="M470 786 L978 760 L978 770 L470 797 Z" fill="#4a4a4a"/>
    <path d="M560 716 L880 702 L930 748 L530 766 Z" fill="#6c6c6c"/>
    <!-- lid -->
    <path d="M548 418 L888 392 L900 682 L520 700 Z" fill="#2a2a2a"/>
    <path d="M562 432 L874 408 L884 666 L536 684 Z" fill="url(#screen)"/>
    <!-- code lines on screen -->
    <g fill="#8e8e8e">
      <rect x="590" y="470" width="120" height="9" transform="skewY(-4)"/>
      <rect x="610" y="498" width="170" height="9" transform="skewY(-4)"/>
      <rect x="610" y="526" width="90" height="9" transform="skewY(-4)"/>
      <rect x="630" y="554" width="150" height="9" transform="skewY(-4)"/>
      <rect x="630" y="582" width="110" height="9" transform="skewY(-4)"/>
      <rect x="610" y="610" width="60" height="9" transform="skewY(-4)"/>
      <rect x="590" y="638" width="140" height="9" transform="skewY(-4)"/>
    </g>
  </g>

  <!-- jebena (clay coffee pot) -->
  <g filter="url(#b1)">
    <ellipse cx="300" cy="712" rx="96" ry="14" fill="#000" opacity=".45" filter="url(#b8)"/>
    <!-- handle -->
    <path d="M276 470 C206 470 196 560 232 618" fill="none" stroke="#1a1a1a" stroke-width="18" stroke-linecap="round"/>
    <!-- spout -->
    <path d="M360 610 C380 560 400 520 432 486 L446 496 C418 536 404 586 392 636 Z" fill="#262626"/>
    <!-- neck -->
    <path d="M276 408 L324 408 L334 540 L266 540 Z" fill="url(#pot)"/>
    <ellipse cx="300" cy="408" rx="28" ry="8" fill="#5a5a5a"/>
    <!-- body -->
    <circle cx="300" cy="620" r="92" fill="url(#pot)"/>
    <path d="M370 570 A92 92 0 0 1 382 660" fill="none" stroke="#9a9a9a" stroke-width="4" opacity=".7"/>
  </g>

  <!-- sini cups with steam -->
  <g filter="url(#b1)">
    <ellipse cx="428" cy="742" rx="74" ry="10" fill="#000" opacity=".4" filter="url(#b8)"/>
    <path d="M384 702 L420 702 L414 740 L390 740 Z" fill="#b8b8b8"/>
    <ellipse cx="402" cy="702" rx="18" ry="5" fill="#2e2e2e"/>
    <path d="M436 708 L472 708 L466 746 L442 746 Z" fill="#a8a8a8"/>
    <ellipse cx="454" cy="708" rx="18" ry="5" fill="#2e2e2e"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".28" filter="url(#b3)">
    <path d="M402 694 C388 664 418 640 402 610 C390 586 412 566 404 540"/>
    <path d="M454 700 C468 672 440 652 456 622 C466 604 450 590 456 572"/>
  </g>

  <rect y="640" width="1000" height="360" fill="url(#vig)"/>
</svg>
</body></html>
