<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bridge Technologies — Technology company in Ethiopia</title>
  <meta name="description" content="Bridge Technologies is a technology company based in Ethiopia.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#2A0909">

  <!-- Open Graph / social preview. Add og:url and an absolute og:image once the production domain is known. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bridge Technologies">
  <meta property="og:title" content="Bridge Technologies">
  <meta property="og:description" content="Bridge Technologies is a technology company based in Ethiopia.">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <!-- Above-the-fold fonts, self-hosted -->
  <link rel="preload" href="assets/fonts/libre-caslon-text-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Bridge Technologies",
    "description": "Technology company based in Ethiopia.",
    "address": { "@type": "PostalAddress", "addressCountry": "ET" }
  }
  </script>
</head>
<body>
  <!-- Shared brand mark: a solid arch bridge inside a ring (stands in for the reference's flame mark) -->
  <svg class="visually-hidden" aria-hidden="true" focusable="false">
    <symbol id="bridge-mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="29.5" fill="none" stroke="currentColor" stroke-width="3"/>
      <path fill="currentColor" d="M17.5 25.5H46.5V45H40.4A8.4 8.4 0 0 0 23.6 45H17.5Z"/>
      <path fill="currentColor" d="M15 21.5h34v2.6H15z"/>
    </symbol>
  </svg>

  <main class="page">
    <article class="profile" aria-labelledby="brand-title">
      <header class="profile__bar">
        <p class="profile__id">
          <svg class="profile__avatar" aria-hidden="true" focusable="false"><use href="#bridge-mark"/></svg>
          <span class="profile__handle">bridge.technologies</span>
          <svg class="profile__badge" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="8" fill="currentColor"/>
            <path d="M4.6 8.2l2.2 2.2 4.6-4.8" fill="none" stroke="#2A0909" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </p>
        <p class="profile__meta">
          <span class="profile__count">6 posts</span>
          <svg class="profile__grid-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M0 0h4v4H0zM6 0h4v4H6zM12 0h4v4h-4zM0 6h4v4H0zM6 6h4v4H6zM12 6h4v4h-4zM0 12h4v4H0zM6 12h4v4H6zM12 12h4v4h-4z"/>
          </svg>
        </p>
      </header>

      <ul class="grid" role="list">
        <!-- 1 · Brand -->
        <li class="tile tile--brand">
          <svg class="brand__mark" aria-hidden="true" focusable="false"><use href="#bridge-mark"/></svg>
          <h1 class="brand" id="brand-title">
            <span class="brand__name">Bridge</span>
            <span class="brand__tag">Technologies · Ethiopia</span>
          </h1>
          <span class="brand__rule" aria-hidden="true"></span>
        </li>

        <!-- 2 · Ethiopia Going Digital -->
        <li class="tile tile--photo">
          <figure class="tile__figure">
            <picture>
              <source type="image/avif" srcset="assets/images/photos/ethiopia-going-digital-crop-370.avif 370w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <source type="image/webp" srcset="assets/images/photos/ethiopia-going-digital-crop-370.webp 370w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <img class="tile__img tile__img--digital" src="assets/images/photos/ethiopia-going-digital-crop.jpg" width="370" height="324" alt="Addis Ababa at night: a ring-shaped modern complex with glass domes, lit roads and a skyline of illuminated towers." fetchpriority="high" decoding="async">
            </picture>
            <figcaption class="caption">Ethiopia, going <em>digital.</em></figcaption>
            <small class="photo-credit">Photo · Firaol Debela Lafto</small>
          </figure>
        </li>

        <!-- 3 · Location -->
        <li class="tile tile--sun">
          <span class="sun" aria-hidden="true"></span>
          <p class="visually-hidden">Based in Ethiopia, at roughly 8 degrees north and 38 degrees east.</p>
          <div class="reading" aria-hidden="true">
            <p class="reading__value">8<sup>°</sup></p>
            <p class="label">North</p>
          </div>
          <p class="reading reading--minor" aria-hidden="true">
            <span class="reading__minor-value">38<sup>°</sup></span>
            <span class="label label--inline">East</span>
          </p>
        </li>

        <!-- 4 · Ethiopian Digital Lifestyle -->
        <li class="tile tile--photo">
          <figure class="tile__figure">
            <picture>
              <source type="image/avif" srcset="assets/images/photos/ethiopian-digital-lifestyle-448.avif 448w, assets/images/photos/ethiopian-digital-lifestyle-640.avif 640w, assets/images/photos/ethiopian-digital-lifestyle-896.avif 896w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <source type="image/webp" srcset="assets/images/photos/ethiopian-digital-lifestyle-448.webp 448w, assets/images/photos/ethiopian-digital-lifestyle-640.webp 640w, assets/images/photos/ethiopian-digital-lifestyle-896.webp 896w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <img class="tile__img tile__img--lifestyle" src="assets/images/photos/ethiopian-digital-lifestyle.jpg" width="896" height="1200" alt="A morning desk by the window: hands on a laptop showing code, beside a jebena coffee pot, a cup of coffee and burning incense on fresh grass." loading="lazy" decoding="async">
            </picture>
            <figcaption>
              <span class="pill">Ethiopia</span>
              <span class="label label--foot">Coffee &amp; code</span>
            </figcaption>
          </figure>
        </li>

        <!-- 5 · Statement -->
        <li class="tile tile--statement">
          <p class="statement">Design.<br>Build.<br><em>Repeat.</em></p>
          <p class="label label--foot label--dark">Bridge · Technologies</p>
        </li>

        <!-- 6 · Technology Meets Nature -->
        <li class="tile tile--photo">
          <figure class="tile__figure">
            <picture>
              <source type="image/avif" srcset="assets/images/photos/technology-meets-nature-448.avif 448w, assets/images/photos/technology-meets-nature-640.avif 640w, assets/images/photos/technology-meets-nature-896.avif 896w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <source type="image/webp" srcset="assets/images/photos/technology-meets-nature-448.webp 448w, assets/images/photos/technology-meets-nature-640.webp 640w, assets/images/photos/technology-meets-nature-896.webp 896w" sizes="(max-width: 559.98px) 100vw, (max-width: 639.98px) 50vw, (max-aspect-ratio: 5/4) 50vw, 34vw">
              <img class="tile__img tile__img--nature" src="assets/images/photos/technology-meets-nature.jpg" width="896" height="1195" alt="People walking along a curved footbridge over a rocky stream, linking glass towers and a geodesic glass building to a forest trail and mountains at golden hour." loading="lazy" decoding="async">
            </picture>
            <figcaption class="caption caption--stacked">
              Technology meets <em>nature.</em>
              <span class="label">Ethiopia · UTC+3</span>
            </figcaption>
          </figure>
        </li>
      </ul>
    </article>
  </main>
</body>
</html>
